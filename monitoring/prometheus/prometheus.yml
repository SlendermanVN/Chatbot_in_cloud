global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: redis_exporter
    static_configs:
      - targets: ["redis_exporter:9121", "redis:9121"]

  - job_name: mysqld_exporter
    static_configs:
      - targets: ["mysqld_exporter:9104", "mysql:9104"]

  - job_name: web
    static_configs:
      - targets: ["web:80"]
