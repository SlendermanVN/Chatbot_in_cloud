global:
  resolve_timeout: 5m

route:
  receiver: "slack-general"
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: "slack-general"
    slack_configs:
      - api_url: "https://hooks.slack.com/services/REPLACE/THIS/HOOK"
        channel: "#alerts"
        text: "[{{ .CommonLabels.severity }}] {{ .CommonAnnotations.summary }} - {{ .CommonAnnotations.description }}"

  - name: "email-team"
    email_configs:
      - to: "ops@example.com"
        from: "alertmanager@example.com"
        smarthost: "smtp.example.com:587"
        auth_username: "alertmanager"
        auth_password: "REPLACE_WITH_PASSWORD"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]
