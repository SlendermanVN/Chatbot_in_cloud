        <!-- Flash message -->
        
        <!-- Error (legacy $error var) -->

                <input type="hidden" name="csrf_token" value="1822a3c78fe59eeb1222e29a6f7d9f063ad1b4c46988495570d17cabd5c9f169">

                    <div>

<script>
(function () {
    var btn  = document.getElementById('togglePwd');
    var inp  = document.getElementById('password');
    var icon = document.getElementById('pwdIcon');
    if (btn) {
        btn.addEventListener('click', function () {
            var isText = inp.type === 'text';
            inp.type   = isText ? 'password' : 'text';
            icon.className = isText ? 'fa-solid fa-eye text-sm' : 'fa-solid fa-eye-slash text-sm';
        });
    }
})();
</script>
