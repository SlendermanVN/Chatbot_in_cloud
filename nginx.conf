# Định nghĩa nhóm xử lý upstream PHP để tạo cơ chế dự phòng (Failover)
upstream php-handler {
    server 127.0.0.1:9000;
    server unix:/var/run/php/php-fpm.sock backup; # Đường dự phòng nếu cổng 9000 bị đóng
}

server {
    listen        80;
    server_name   localhost;
    root          /home/site/wwwroot/public;
    index         index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        
        # GỌI QUA UPSTREAM ĐÃ ĐỊNH NGHĨA TRÊN ĐẦU FILE
        fastcgi_pass             php-handler;
        
        fastcgi_index            index.php;
        include                  fastcgi_params;
        fastcgi_param            SCRIPT_FILENAME /home/site/wwwroot/public$fastcgi_script_name;
        fastcgi_param            PATH_INFO $fastcgi_path_info;
    }
}